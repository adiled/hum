[project]
name = "thrum"
version = "0.8.0"
description = "Thrum for a bee written in Python: the generated registry and views, and the client end of `hum bee link`."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hum contributors" }]
requires-python = ">=3.9"
keywords = ["thrum", "hum", "p2p", "agents", "ndjson"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
]

[project.urls]
Homepage   = "https://adiled.github.io/hum/"
Repository = "https://github.com/adiled/hum"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["thrum"]
