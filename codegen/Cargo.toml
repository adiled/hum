[package]
name = "codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read hum.thrum, emit the TS, Python, Go and C clients from it, and hold thrum-core's Rust to it."

[lib]
path = "src/lib.rs"

[[bin]]
name = "codegen"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
regex = { workspace = true }
syn = { version = "2", features = ["full", "parsing"] }
