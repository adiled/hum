[package]
name = "ids"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hum-native 256-bit Crockford-base32 identifiers: 48-bit ms timestamp + 208 random bits."

[dependencies]
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
serde_json = { workspace = true }
