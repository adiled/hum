[package]
name = "hum-thrum"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The thrum client: one bee client, sans-IO at its core, driven by tokio for Rust bees and by `hum bee link` for every other language."

[dependencies]
hum-paths = { path = "../hum-paths" }
hum-identity = { path = "../hum-identity" }
thrum-core = { path = "../thrum-core" }
tokio = { workspace = true, features = ["net", "io-util", "io-std", "sync", "macros", "rt", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
