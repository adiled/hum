name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Source-only GitHub release. Per-platform binary builds were dropped
  # in 0.31 — the x86_64-apple-darwin leg kept hanging, blocking the
  # whole release. Reintroduce when there's a reliable cross-platform
  # path; for now consumers build from source via `cargo install` or
  # the installer at hum.sh.
  #
  # hum is not published to crates.io, so there is no publish step.
  # The version bump, the lockfiles and the tag are done locally by
  # ./release.sh; this workflow only publishes the release.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
