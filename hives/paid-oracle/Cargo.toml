[package]
name = "paid-oracle"
version = "0.33.1"
edition = "2024"
license = "MIT"
description = "An attendant that sells a price per call for USDC, x402-style, verified on chain."

[dependencies]
thrum-core = { path = "../../thrum-core" }
hum-identity = { path = "../../hum-identity" }
hum-thrum = { path = "../../hum-thrum" }
hum-paths = { path = "../../hum-paths" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
humd = { path = "../../humd" }
tempfile = "3"

[[bin]]
name = "paid-oracle"
path = "src/main.rs"
[workspace]
