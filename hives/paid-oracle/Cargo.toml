[package]
name = "paid-oracle"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "x402-style paid oracle bee — sells one price per USDC payment, verified on-chain."

[dependencies]
thrum-core = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-identity = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
hex = { version = "0.4", features = ["serde"] }

[[bin]]
name = "paid-oracle"
path = "src/main.rs"
[workspace]
