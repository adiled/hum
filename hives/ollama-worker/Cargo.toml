[package]
name = "ollama-worker"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "WorkerBee that calls Ollama's API directly — run local LLMs without claude."

[[bin]]
name = "ollama-worker"
path = "src/main.rs"

[dependencies]
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-nest = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-identity = { git = "https://github.com/adiled/hum.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
[workspace]
