[package]
name = "apple-fm"
version = "0.34.3"
edition = "2024"
license = "MIT"
description = "Apple's on-device foundation model as a hum nurse: local, network-free and key-free, through a small Swift bridge to FoundationModels."

[dependencies]
thrum-core = { path = "../../thrum-core" }
hum-paths = { path = "../../hum-paths" }
hum-nest = { path = "../../hum-nest" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
humd = { path = "../../humd" }
hum-identity = { path = "../../hum-identity" }
hum-thrum = { path = "../../hum-thrum" }
tempfile = "3"

[[bin]]
name = "apple-fm-nurse"
path = "src/main.rs"
[workspace]
