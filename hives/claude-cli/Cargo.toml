[package]
name = "claude-cli"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "Concrete WorkerBee impl: `claude -p` over a pipe. Builds the CLI command line from a high-level SpawnSpec, parses stream-json stdout."

[[bin]]
name = "claude-cli-worker"
path = "src/main.rs"

[dependencies]
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-nest = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-identity = { git = "https://github.com/adiled/hum.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
command-group = { version = "5", features = ["with-tokio"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
[workspace]
