[package]
name = "humfs"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "humfs — hum's native filesystem forager hive. Symbol-aware code surface (read/do_code/do_noncode/bash/task), AST-grounded via tree-sitter. Translates chi:tool-call ↔ filesystem ops; humd routes other foragers' tool-calls here."

[dependencies]
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-nest = { git = "https://github.com/adiled/hum.git", branch = "main" }
thrum-core = { git = "https://github.com/adiled/hum.git", branch = "main" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"
regex = "1"
base64 = "0.22"
mime_guess = "2"

# AST infra — tree-sitter parsers per language. Versions kept loose
# (^minor) so security patches roll in; the parser ABI version is
# what matters and we pin to tree-sitter 0.26 family.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

[[bin]]
name = "humfs-forager"
path = "src/main.rs"
[workspace]
