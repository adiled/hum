[package]
name = "claude-repl"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "Concrete WorkerBee impl: interactive `claude` over a PTY. v0 stub — no classifier."

[[bin]]
name = "claude-repl-worker"
path = "src/main.rs"

[dependencies]
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-nest = { git = "https://github.com/adiled/hum.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
[workspace]
