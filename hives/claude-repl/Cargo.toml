[package]
name = "claude-repl"
version = "0.33.1"
edition = "2024"
license = "MIT"
description = "A nurse: interactive `claude` over a PTY. v0 stub — no classifier."

[[bin]]
name = "claude-repl-nurse"
path = "src/main.rs"

[dependencies]
hum-paths = { path = "../../hum-paths" }
hum-nest = { path = "../../hum-nest" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
[workspace]
