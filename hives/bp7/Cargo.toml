[package]
name = "bp7"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "RFC 9171 Bundle Protocol v7 forager hive — interplanetary store-and-forward bridge to hum."

[dependencies]
thrum-core = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-identity = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bundle-protocol = { package = "bp7", version = "0.10" }

[[bin]]
name = "bp7-forager"
path = "src/main.rs"
[workspace]
