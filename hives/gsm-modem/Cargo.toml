[package]
name = "gsm-modem"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "Hum-on-a-burner-phone — USB GSM modem bee driven by AT commands over serial."

[dependencies]
thrum-core = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-identity = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }

[[bin]]
name = "gsm-modem"
path = "src/main.rs"
[workspace]
