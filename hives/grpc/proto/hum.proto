syntax = "proto3";

package hum;

// Bidirectional tone stream: one RPC, every chi flows through.
//
// The client opens Stream and sends tones (prompt, cancel,
// tendril-result, ...). The server (this bee) bridges to humd over
// thrum and pumps tones back (unfurl, wilt, tendril-reach, pulse,
// breath, ...).
//
// The payload stays opaque on the wire: each Tone carries its full JSON
// shape in `body`. The routing fields are pulled out so the bridge can
// multiplex without parsing every body: `chi` is the tone's kind, `sid`
// the conversation it belongs to, and `rid` its request id, which
// correlates an echo or a response with what it answers.
service Hum {
  rpc Stream(stream Tone) returns (stream Tone);
}

message Tone {
  string chi  = 1;
  string sid  = 2;
  string rid  = 3;
  bytes  body = 4;
}
