[package]
name = "grpc-forager"
version = "0.32.0"
edition = "2024"
license = "MIT"
description = "gRPC bridge to hum — bidi stream, every chi flows through; transport-only bee."

[dependencies]
thrum-core = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-identity = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-thrum = { git = "https://github.com/adiled/hum.git", branch = "main" }
hum-paths = { git = "https://github.com/adiled/hum.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "grpc-forager"
path = "src/main.rs"
[workspace]
