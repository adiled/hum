[package]
name = "grpc-forager"
version = "0.33.1"
edition = "2024"
license = "MIT"
description = "gRPC bridge to hum — bidi stream, every chi flows through; transport-only bee."

[dependencies]
thrum-core = { path = "../../thrum-core" }
hum-identity = { path = "../../hum-identity" }
hum-thrum = { path = "../../hum-thrum" }
hum-paths = { path = "../../hum-paths" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"

[dev-dependencies]
humd = { path = "../../humd" }
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "grpc-forager"
path = "src/main.rs"
[workspace]
