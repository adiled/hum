[package]
name = "nest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Process supervision for hum's worker hives — child-group lifecycle, per-cell metrics, rlimit wiring. The worker contract lives in hum-nest (leaf); this crate is the runtime only spawners need."

[dependencies]
hum-nest = { path = "../hum-nest" }
tokio = { workspace = true }
tokio-util = "0.7"
command-group = { version = "5", features = ["with-tokio"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
metrics = "0.23"
serde = { workspace = true }
tracing = { workspace = true }