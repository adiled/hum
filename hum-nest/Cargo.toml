[package]
name = "hum-nest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hum's hive-side kernel — worker contract (WorkerBee/Egg/Cell), process supervision (lifecycle/metrics/limits), and the serve_worker / serve_forager wire loops. One crate, no nest-common indirection."

[dependencies]
hum-paths = { path = "../hum-paths" }
hum-identity = { path = "../hum-identity" }
hum-thrum = { path = "../hum-thrum" }
hum-mcp = { path = "../hum-mcp" }
thrum-core = { path = "../thrum-core" }

anyhow = { workspace = true }
async-trait = { workspace = true }
command-group = { version = "5", features = ["with-tokio"] }
lru = "0.12"
metrics = "0.23"
rand = "0.8"
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "rt", "rt-multi-thread", "time", "process"] }
tokio-util = "0.7"
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
libc = "0.2"
tempfile = "3"